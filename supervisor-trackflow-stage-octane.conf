# Staging Octane/FrankenPHP worker on port 8071 (production uses port 8000)
[program:trackflow-stage-octane]
command=/usr/bin/php8.4 /home/malma/stage-trackflow/artisan octane:start --server=frankenphp --host=127.0.0.1 --port=8071 --workers=auto --max-requests=500
directory=/home/malma/stage-trackflow
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
numprocs=1
# Use www-data user (consistent with production) instead of malma to avoid privilege escalation.
# If /home/malma/stage-trackflow is owned by malma:malma, grant www-data write access to storage/:
#   sudo chown -R malma:www-data /home/malma/stage-trackflow/{storage,bootstrap/cache}
#   sudo find /home/malma/stage-trackflow/{storage,bootstrap/cache} -type d -exec chmod 2775 {} +
#   sudo find /home/malma/stage-trackflow/{storage,bootstrap/cache} -type f -exec chmod 0664 {} +
user=www-data
umask=0002
redirect_stderr=true
# Log file in root-owned directory to prevent symlink attacks from the app process.
# /var/log/supervisor/ is typically owned by root and should already exist.
stdout_logfile=/var/log/supervisor/trackflow-stage-octane.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=30
priority=999
environment=PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
